# Topology of the disposable E2E cluster: one control plane and two workers, so
# that the three-instance fixture cluster spreads over more than one node and
# `Cluster.status.topology` has something to show (SPEC-0002).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
