# The cluster every write case of the suite runs against (SPEC-0020): it lives
# in a namespace of its own, so the clusters the read-only cases assert stay
# exactly as their fixtures left them, whatever a write case does or leaves
# behind. Two instances, so there is a standby to promote, to restart and to
# fence; the working object store of MinIO, so a backup requested by hand
# completes; a weekly schedule that never fires during a run, to suspend,
# resume and run by hand (SPEC-0021).
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-e2e-actions
---
apiVersion: v1
kind: Secret
metadata:
  name: actions-store-creds
  namespace: cnpg-e2e-actions
type: Opaque
stringData:
  ACCESS_KEY_ID: e2e-minio
  ACCESS_SECRET_KEY: e2e-minio-secret-1
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: actions-store
  namespace: cnpg-e2e-actions
spec:
  configuration:
    destinationPath: s3://backups/
    endpointURL: http://minio.cnpg-e2e.svc:9000
    s3Credentials:
      accessKeyId:
        name: actions-store-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: actions-store-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: e2e-actions
  namespace: cnpg-e2e-actions
spec:
  instances: 2
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: actions-store
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: e2e-actions-weekly
  namespace: cnpg-e2e-actions
spec:
  schedule: 0 0 3 * * 0
  immediate: false
  backupOwnerReference: self
  cluster:
    name: e2e-actions
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
