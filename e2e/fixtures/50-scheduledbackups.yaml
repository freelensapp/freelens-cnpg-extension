# A nightly schedule that never fires during a test run (immediate: false), so
# the views show lastScheduleTime empty and nextScheduleTime in the future.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: e2e-nightly
  namespace: cnpg-e2e
spec:
  schedule: "0 0 3 * * *"
  immediate: false
  backupOwnerReference: self
  cluster:
    name: e2e-main
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
